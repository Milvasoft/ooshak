# Builds the Windows installer and the macOS app, tests both on their own platform and
# publishes the setup files as pipeline artifacts. Run by hand with the version to stamp.

trigger: none
pr: none

parameters:
  - name: version
    displayName: Version
    type: string
    default: 0.2.0

variables:
  VERSION: ${{ parameters.version }}
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  - job: windows
    displayName: Windows installer
    pool:
      vmImage: windows-latest
    steps:
      - task: UseDotNet@2
        inputs:
          packageType: sdk
          version: 10.0.x

      - script: dotnet test tests/Ooshak.Tests/Ooshak.Tests.csproj -c Release -f net10.0-windows
        displayName: Test

      - script: dotnet publish src/Ooshak/Ooshak.csproj -c Release -r win-x64 --self-contained true -o artifacts/publish -p:Version=$(VERSION)
        displayName: Publish

      - pwsh: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DAppVersion=$env:VERSION" "/DSourceDir=..\artifacts\publish" installer\Ooshak.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force artifacts/out | Out-Null
          Move-Item artifacts/Ooshak-Setup-*.exe artifacts/out/
        displayName: Build installer

      - publish: artifacts/out
        artifact: windows
        displayName: Publish installer

  - job: macos
    displayName: macOS app
    pool:
      vmImage: macOS-15-arm64
    steps:
      - task: UseDotNet@2
        inputs:
          packageType: sdk
          version: 10.0.x

      - script: |
          uname -m
          sw_vers
        displayName: Agent

      - script: dotnet test tests/Ooshak.Tests/Ooshak.Tests.csproj -c Release -f net10.0
        displayName: Test

      - script: sh installer/mac/build-app.sh "$(VERSION)" osx-arm64
        displayName: Build app and DMG

      # Downloads the models, speaks a command with the system voice and runs it through Silero,
      # Whisper and the router, so the native libraries are proven to load on a real Mac.
      - script: artifacts/mac-arm64/Ooshak.app/Contents/MacOS/Ooshak --self-test
        displayName: Self test

      - script: |
          mkdir -p artifacts/out
          mv artifacts/Ooshak-*-macos-*.dmg artifacts/out/
        displayName: Collect DMG

      - publish: artifacts/out
        artifact: macos
        displayName: Publish DMG
