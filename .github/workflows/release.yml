name: Release

# Releases are built by azure-pipelines.yml, which also makes the macOS DMG. This
# Windows-only workflow stays as a manual fallback.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version without the leading v, for example 0.2.0
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Read version
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}"
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Test
        run: dotnet test --configuration Release

      - name: Publish
        run: dotnet publish src/Ooshak/Ooshak.csproj -c Release -r win-x64 --self-contained true -o artifacts/publish -p:Version=${{ env.VERSION }}

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DAppVersion=$env:VERSION" "/DSourceDir=..\artifacts\publish" installer\Ooshak.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Write checksums
        shell: pwsh
        run: |
          # LF endings so that `sha256sum -c` works on Linux and in Git Bash.
          $lines = Get-ChildItem artifacts -Filter *.exe | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          }
          [IO.File]::WriteAllText("$PWD/artifacts/SHA256SUMS.txt", (($lines -join "`n") + "`n"))

      # Versions below 1.0 and versions with a suffix such as -beta are marked as pre-releases.
      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $prerelease = if ($env:VERSION -like '0.*' -or $env:VERSION -like '*-*') { '--prerelease' } else { '' }
          gh release create "v$env:VERSION" artifacts/Ooshak-Setup-*.exe artifacts/SHA256SUMS.txt `
            --title "Ooshak $env:VERSION" --generate-notes $prerelease
